<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>LittingtonVizualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="viz"></canvas>
  <div id="titlebar"></div>

  <main id="overlay">
    <section id="card">
      <div id="art-wrap">
        <img id="art" alt="">
        <div id="art-empty">♪</div>
      </div>
      <div id="meta">
        <h1 id="title">Nothing playing</h1>
        <p id="byline"><span id="artist">Open Spotify or YouTube Music</span><span id="album"></span></p>
        <nav id="tabs">
          <button data-tab="lyrics" class="active">Lyrics</button>
          <button data-tab="queue">Up next</button>
        </nav>
        <div id="panel">
          <div id="lyrics" class="pane active"></div>
          <div id="queue" class="pane"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="status"></div>
  <div id="toast"></div>
  <div id="help">
    <b>F</b> fullscreen <b>← →</b> preset <b>L</b> lock <b>Tab</b> lyrics / up next <b>C</b> album colours <b>H</b> hide
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
