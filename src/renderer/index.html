<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>LittingtonVizualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="viz"></canvas>
  <div id="titlebar"></div>

  <main id="overlay">
    <section id="card">
      <div id="art-wrap">
        <img id="art" alt="">
        <div id="art-empty">♪</div>
      </div>
      <div id="meta">
        <h1 id="title">Nothing playing</h1>
        <p id="byline"><span id="artist">Open Spotify or YouTube Music</span><span id="album"></span></p>
        <nav id="tabs">
          <button data-tab="lyrics" class="active">Lyrics</button>
          <button data-tab="queue">Up next</button>
        </nav>
        <div id="panel">
          <div id="lyrics" class="pane active"></div>
          <div id="queue" class="pane"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- compact song info for a corner of the screen -->
  <aside id="mini">
    <div id="mini-art-wrap"><img id="mini-art" alt=""><div id="mini-empty">♪</div></div>
    <div id="mini-text">
      <div id="mini-title">Nothing playing</div>
      <div id="mini-by"></div>
    </div>
  </aside>

  <div id="settings">
    <button id="gear" aria-label="Display settings" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>
    <div id="menu" hidden>
      <div class="group-label">Song info</div>
      <div class="segmented" id="info-mode">
        <button data-info="full">Full</button>
        <button data-info="corner">Corner</button>
        <button data-info="off">Off</button>
      </div>
      <div class="group-label">Mood</div>
      <div class="segmented wrap" id="mood-pick">
        <button data-mood="auto">Auto</button>
        <button data-mood="hype">Hype</button>
        <button data-mood="smooth">Smooth</button>
        <button data-mood="pop">Pop</button>
        <button data-mood="neutral">Neutral</button>
      </div>
      <div class="hint" id="mood-hint"></div>
      <div class="group-label" id="corner-label">Corner</div>
      <div class="corners" id="corner-pick">
        <button data-corner="tl" aria-label="Top left"></button>
        <button data-corner="tr" aria-label="Top right"></button>
        <button data-corner="bl" aria-label="Bottom left"></button>
        <button data-corner="br" aria-label="Bottom right"></button>
      </div>
    </div>
  </div>

  <div id="status"></div>
  <div id="toast"></div>
  <div id="help">
    <b>F</b> fullscreen <b>← →</b> preset <b>L</b> lock <b>Tab</b> lyrics / up next <b>M</b> song info <b>V</b> mood <b>C</b> album colours <b>H</b> hide all
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
