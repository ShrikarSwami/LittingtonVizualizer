# Builds the Windows installer (.exe) on a real Windows machine.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LittingtonVizualizer-Windows
          path: dist/*.exe
          if-no-files-found: error
