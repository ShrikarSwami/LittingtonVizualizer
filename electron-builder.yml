appId: com.littington.vizualizer
productName: LittingtonVizualizer
directories:
  buildResources: build
  output: dist
files:
  - src/**
  - package.json
extraResources:
  # the native helper that captures the music app's audio
  - from: native/audio-tap/.build/release/AudioTap
    to: bin/AudioTap
  # the companion Chrome extension, kept as plain files so Chrome can load it
  - from: extension
    to: extension
mac:
  category: public.app-category.music
  icon: build/icon.icns
  target: dmg
  identity: "-"            # ad-hoc signature: runs on this Mac without an Apple developer account
  hardenedRuntime: false
  extendInfo:
    NSAppleEventsUsageDescription: LittingtonVizualizer asks Spotify what is currently playing.
win:
  icon: build/icon.ico
linux:
  icon: build/icon.png
