appId: com.littington.vizualizer
productName: LittingtonVizualizer
directories:
  buildResources: build
  output: dist
files:
  - src/**
  - package.json
extraResources:
  # the companion Chrome extension, kept as plain files so Chrome can load it
  - from: extension
    to: extension
mac:
  category: public.app-category.music
  icon: build/icon.icns
  target: dmg
  # Sign with the Apple Development certificate in the login keychain. A real identity keeps the
  # audio-capture permission valid across rebuilds; an ad-hoc signature would make macOS ask again
  # after every reinstall. (No certificate? Set `identity: "-"` instead of `type`.)
  type: development
  hardenedRuntime: false
  extraResources:
    # the native helper that captures the music app's audio
    - from: native/audio-tap/.build/release/AudioTap
      to: bin/AudioTap
  extendInfo:
    NSAppleEventsUsageDescription: LittingtonVizualizer asks Spotify what is currently playing.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
  artifactName: LittingtonVizualizer-Setup-${version}.${ext}
nsis:
  oneClick: true          # installs for the current user, no admin prompt, then launches
  shortcutName: LittingtonVizualizer
linux:
  icon: build/icon.png
